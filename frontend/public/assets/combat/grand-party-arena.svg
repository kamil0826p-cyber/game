<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Grand party battle arena</title>
  <desc id="desc">A wide ancient night arena designed for two parties of ten, with two broad formation terraces and a clear central combat lane.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.52" stop-color="#10243a"/>
      <stop offset="1" stop-color="#1a2937"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#4f82a6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#08111c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24394c"/>
      <stop offset="1" stop-color="#111a25"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263a48"/>
      <stop offset="0.42" stop-color="#172733"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="terraceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253d43"/>
      <stop offset="0.55" stop-color="#172a2e"/>
      <stop offset="1" stop-color="#0a1218"/>
    </linearGradient>
    <linearGradient id="terraceRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41282d"/>
      <stop offset="0.55" stop-color="#2c1d24"/>
      <stop offset="1" stop-color="#110d13"/>
    </linearGradient>
    <linearGradient id="centerLane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#314b59" stop-opacity="0.65"/>
      <stop offset="0.62" stop-color="#16242d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#070b10" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="leftAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#63d9bf" stop-opacity="0.13"/>
      <stop offset="0.62" stop-color="#2d8677" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#163d37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ef7181" stop-opacity="0.13"/>
      <stop offset="0.62" stop-color="#9c3c4b" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#421923" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldRune" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f1d889" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#d0a95a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d0a95a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="mist" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="floorGrid" width="120" height="84" patternUnits="userSpaceOnUse" patternTransform="skewX(-8)">
      <path d="M0 84 60 0M60 84 120 0" fill="none" stroke="#86a7b6" stroke-opacity="0.055" stroke-width="2"/>
      <path d="M0 42H120M0 84H120" fill="none" stroke="#86a7b6" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
