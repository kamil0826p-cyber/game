name: Materialize animated outfits once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'agent/complete-outfit-sprite-set'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-outfit-sprite-set
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python frontend/scripts/materialize_animated_outfits.py
      - uses: actions/upload-artifact@v4
        with:
          name: animated-outfit-sheets
          path: frontend/public/assets/sprites/*.svg
          if-no-files-found: error
          retention-days: 1
