name: Materialize static outfits once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/complete-outfit-sprite-set'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-outfit-sprite-set
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python frontend/scripts/materialize_outfits.py
      - name: Remove one-time materializer
        run: |
          rm frontend/scripts/materialize_outfits.py
          rm .github/workflows/materialize-outfits-once.yml
          rm -f frontend/src/assets/outfitSprites/mageA.ts
      - name: Commit static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend/public/assets frontend/scripts frontend/src/assets/outfitSprites .github/workflows
          git commit -m "Commit complete static outfit sprite set"
          git push origin HEAD:agent/complete-outfit-sprite-set
