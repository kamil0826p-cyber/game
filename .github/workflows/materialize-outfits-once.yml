name: Materialize static outfits once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'agent/complete-outfit-sprite-set'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-outfit-sprite-set
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python frontend/scripts/materialize_outfits.py
      - uses: actions/upload-artifact@v4
        with:
          name: complete-static-outfits
          path: |
            frontend/public/assets/manifest.json
            frontend/public/assets/sprites/*.png
          if-no-files-found: error
          retention-days: 1
