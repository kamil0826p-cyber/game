name: Freeze generated maps once
run-name: Freeze generated maps once - second trigger

on:
  push:
    branches:
      - agent/tiled-map-engine-refactor
    paths:
      - .github/workflows/freeze-generated-maps.yml

permissions:
  contents: write

jobs:
  freeze-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tiled-map-engine-refactor
          fetch-depth: 0

      - name: Generate final static maps
        run: node scripts/generate-maps.mjs

      - name: Commit static map files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/maps/greenfields.json prisma/maps/crystal-cave.json frontend/public/maps/greenfields.json frontend/public/maps/crystal-cave.json
          if git diff --cached --quiet; then
            echo "Map files are already frozen."
            exit 0
          fi
          git commit -m "Freeze large Tiled maps"
          git push origin HEAD:agent/tiled-map-engine-refactor
