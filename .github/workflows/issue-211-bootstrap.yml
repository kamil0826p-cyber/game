name: Issue 211 dependency bootstrap

on:
  push:
    branches:
      - agent/issue-211-reactive-narrative
    paths:
      - .github/workflows/issue-211-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize merged consequence source package
        shell: bash
        run: |
          set -euo pipefail
          test -d .upload
          cat .upload/chunk-* > /tmp/consequence-payload.b64
          base64 --decode /tmp/consequence-payload.b64 > /tmp/consequence-payload.tar.gz
          echo "be04a8eb346bf47fba8fd2c491107a7cdd9a7ec0913b8afe3511cb52919e4b53  /tmp/consequence-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/consequence-payload.tar.gz -C .
          rm -rf .upload .github/workflows/issue-211-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize merged consequence dependency (#210)"
          git push origin HEAD:agent/issue-211-reactive-narrative
