name: Agent source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and materialize consequence source package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .upload ]; then
            echo "Source package already materialized."
            exit 0
          fi
          cat .upload/chunk-* > /tmp/consequence-payload.b64
          base64 --decode /tmp/consequence-payload.b64 > /tmp/consequence-payload.tar.gz
          echo "be04a8eb346bf47fba8fd2c491107a7cdd9a7ec0913b8afe3511cb52919e4b53  /tmp/consequence-payload.tar.gz" | sha256sum --check -
          tar -xzf /tmp/consequence-payload.tar.gz -C .
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement character consequences (#210)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
